<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu trường Nihongo – Ôn tập Bài 3 · 4 · 5</title>
<style>
:root{
  --bg1:#fff7ed; --bg2:#eef2ff; --ink:#1e293b; --mut:#64748b; --card:#ffffff;
  --ok:#16a34a; --bad:#dc2626; --pri:#4f46e5; --gold:#f59e0b;
  --jp:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,1.1vw,22px)}
body{margin:0;font-family:"Segoe UI",var(--jp),Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}
.jp{font-family:var(--jp)}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;
  padding:.5rem 1rem;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  box-shadow:0 2px 10px rgba(0,0,0,.08)}
.brand{font-weight:800;font-size:1.2rem;cursor:pointer;white-space:nowrap}
.brand small{display:block;font-weight:600;font-size:.75rem;color:var(--mut)}
#scoreboard{flex:1;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.chip{--c:#999;display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem;border-radius:1rem;
  background:#fff;border:3px solid var(--c);min-width:10.5rem;cursor:pointer;transition:.2s;position:relative}
.chip .av{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--c);color:#fff;display:grid;
  place-items:center;font-weight:800;font-size:1.1rem}
.chip .nm{font-weight:700;font-size:.95rem;max-width:7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{font-weight:900;font-size:1.6rem;color:var(--c);line-height:1}
.chip .adj{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.chip .adj button{width:1.5rem;height:1.2rem;font-size:.8rem;border-radius:.3rem;background:#f1f5f9;color:#334155;line-height:1}
.chip.active{transform:translateY(-2px) scale(1.06);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 6px 16px rgba(0,0,0,.15)}
.chip.active::after{content:"▼ Lượt";position:absolute;top:-1.15rem;left:50%;transform:translateX(-50%);
  font-size:.7rem;font-weight:800;color:var(--c)}
.chip.bump .sc{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.5)}}
.tools{display:flex;gap:.4rem}
.tools button{padding:.45rem .7rem;border-radius:.6rem;background:#eef2ff;color:var(--pri);font-weight:700;font-size:.9rem}
.float{position:fixed;z-index:99;font-weight:900;font-size:2rem;pointer-events:none;animation:floatUp 1.2s forwards;text-shadow:0 2px 0 #fff}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}

/* ---------- layout ---------- */
#app{max-width:1400px;margin:0 auto;padding:1.2rem 1.5rem 3rem}
.panel{background:var(--card);border-radius:1.4rem;box-shadow:0 8px 30px rgba(30,41,59,.08);padding:1.5rem}
.round-head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.round-head h2{margin:0;font-size:1.8rem}
.round-head .meta{margin-left:auto;font-weight:700;color:var(--mut);font-size:1.1rem}
.rule{background:#f8fafc;border-left:5px solid var(--pri);padding:.6rem 1rem;border-radius:.6rem;color:#334155;margin-bottom:1rem;font-size:1rem}
.btn{padding:.75rem 1.4rem;border-radius:.9rem;font-weight:800;font-size:1.1rem;background:var(--pri);color:#fff;box-shadow:0 4px 0 #3730a3;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3730a3}
.btn.ghost{background:#e2e8f0;color:#334155;box-shadow:0 4px 0 #94a3b8}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #166534}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #991b1b}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #b45309}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.turnbar{font-size:1.4rem;font-weight:800;margin:.3rem 0 1rem}
.turn-name{padding:.15rem .8rem;border-radius:.6rem;color:#fff}

/* ---------- setup ---------- */
.setup{max-width:760px;margin:3rem auto}
.setup h1{font-size:2.6rem;margin:.2rem 0;text-align:center}
.setup .sub{text-align:center;color:var(--mut);margin-bottom:1.5rem;font-size:1.1rem}
.pin{display:flex;align-items:center;gap:.8rem;margin:.6rem 0}
.pin .dot{width:2.6rem;height:2.6rem;border-radius:50%;flex:none}
.pin input{flex:1;font-size:1.3rem;padding:.6rem .9rem;border-radius:.8rem;border:2px solid #e2e8f0;font-family:inherit}

/* ---------- menu ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.mcard{background:#fff;border-radius:1.3rem;padding:1.3rem;box-shadow:0 8px 24px rgba(30,41,59,.08);cursor:pointer;
  border:3px solid transparent;transition:.15s;text-align:left}
.mcard:hover{border-color:var(--pri);transform:translateY(-3px)}
.mcard .ic{font-size:2.8rem}
.mcard h3{margin:.4rem 0 .3rem;font-size:1.35rem}
.mcard p{margin:0;color:var(--mut);font-size:.95rem;line-height:1.4}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:1rem;font-size:.8rem;font-weight:800;margin-right:.3rem}
.b-easy{background:#dcfce7;color:#166534}.b-think{background:#fee2e2;color:#991b1b}.b-mix{background:#fef3c7;color:#92400e}.b-time{background:#e0e7ff;color:#3730a3}
.mcard.done{opacity:.75}
.mcard.done h3::after{content:" ✔";color:var(--ok)}

/* ---------- speed quiz ---------- */
.timer{height:1.1rem;background:#e2e8f0;border-radius:1rem;overflow:hidden;position:relative;margin-bottom:1rem}
.timer .bar{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width 1s linear;width:100%}
.timer .tnum{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-weight:900;font-size:.85rem}
.qbox{text-align:center;padding:1.4rem 1rem;border-radius:1.2rem;background:#f8fafc;margin-bottom:1rem}
.qbox .tag{display:inline-block;font-size:.85rem;font-weight:800;color:var(--pri);background:#e0e7ff;padding:.1rem .6rem;border-radius:1rem;margin-bottom:.6rem}
.qbox .ctx{color:#475569;font-size:1.2rem;margin-bottom:.6rem;font-style:italic}
.qbox .q{font-size:2.2rem;font-weight:800;line-height:1.35}
.buzz{display:flex;gap:.7rem;justify-content:center;align-items:center;margin:.6rem 0 1rem;flex-wrap:wrap}
.buzz .lbl{font-weight:800;color:var(--mut)}
.pbtn{--c:#999;padding:.6rem 1.1rem;border-radius:.9rem;background:#fff;border:3px solid var(--c);color:var(--c);font-weight:900;font-size:1.15rem}
.pbtn.sel{background:var(--c);color:#fff;transform:scale(1.08)}
.pbtn:disabled{opacity:.3;text-decoration:line-through}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.opt{padding:1rem 1.2rem;border-radius:1rem;background:#fff;border:3px solid #cbd5e1;font-size:1.55rem;font-weight:700;text-align:left;
  display:flex;gap:.8rem;align-items:center;color:var(--ink);font-family:var(--jp)}
.opt .k{flex:none;width:2.3rem;height:2.3rem;border-radius:.6rem;background:#e2e8f0;display:grid;place-items:center;font-size:1.1rem;font-family:"Segoe UI",sans-serif}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.right{background:#dcfce7;border-color:var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.opts.wait .opt{opacity:.55}
.feedback{min-height:2.5rem;margin:1rem 0 .4rem;font-size:1.25rem;font-weight:700;text-align:center}
.feedback .note{display:block;font-weight:500;font-size:1.05rem;color:#334155;margin-top:.3rem}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.nav{display:flex;justify-content:center;gap:1rem;margin-top:.6rem}

/* ---------- memory ---------- */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;perspective:900px}
.mc{height:7.2rem;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.mc.open,.mc.matched{transform:rotateY(180deg)}
.mc .face{position:absolute;inset:0;border-radius:1rem;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:.4rem;font-weight:800}
.mc .back{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-size:2.2rem;box-shadow:0 4px 0 #4338ca}
.mc .front{background:#fff;transform:rotateY(180deg);border:3px solid #cbd5e1;font-size:1.35rem}
.mc .front.jpw{font-family:var(--jp);font-size:1.9rem}
.mc.matched .front{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,white)}
.mc.shake{animation:shake .4s}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}

/* ---------- ordering ---------- */
.ord-vi{font-size:1.9rem;font-weight:800;text-align:center;margin:.5rem 0 1.2rem}
.slots{min-height:5rem;border:3px dashed #a5b4fc;border-radius:1rem;padding:.8rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;background:#f8fafc}
.slots.ok{border-color:var(--ok);background:#f0fdf4}.slots.bad{border-color:var(--bad);background:#fef2f2}
.slots .ph{color:#94a3b8;font-size:1.1rem}
.pool{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin:1.2rem 0}
.tok{font-family:var(--jp);font-size:1.8rem;font-weight:800;padding:.5rem 1rem;border-radius:.8rem;background:#fff;border:3px solid #818cf8;color:#312e81;box-shadow:0 4px 0 #c7d2fe}
.tok.used{visibility:hidden}
.slots .tok{border-color:#4f46e5;background:#eef2ff}
.answer-line{font-family:var(--jp);font-size:1.8rem;font-weight:800;color:var(--ok)}

/* ---------- detective ---------- */
.parts{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.4rem 0}
.part{font-family:var(--jp);font-size:2rem;font-weight:800;padding:.5rem 1rem;border-radius:.8rem;background:#fff;border:3px solid #cbd5e1;color:var(--ink)}
.part:hover:not(:disabled){border-color:#f97316;background:#fff7ed}
.part.wrong{background:#fee2e2;border-color:var(--bad)}
.part.right{background:#fef9c3;border-color:#ca8a04;text-decoration:underline wavy #dc2626}
.fixbox{margin-top:1rem;background:#f0fdf4;border:2px solid #86efac;border-radius:1rem;padding:1rem 1.2rem;font-size:1.15rem}
.fixbox .jp{font-size:1.7rem;font-weight:800;color:#166534}

/* ---------- mystery ---------- */
.mys{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.pic{position:relative;aspect-ratio:6/5;border-radius:1.2rem;overflow:hidden;background:#0f172a}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}
.tile{border:2px solid rgba(255,255,255,.6);font-size:2.6rem;font-weight:900;color:#fff;transition:opacity .6s,transform .6s;
  background:linear-gradient(135deg,#f97316,#db2777)}
.tile:nth-child(even){background:linear-gradient(135deg,#6366f1,#0ea5e9)}
.tile:nth-child(4n+2),.tile:nth-child(4n+3){filter:hue-rotate(25deg)}
.tile:hover:not(:disabled){filter:brightness(1.15)}
.tile.gone{opacity:0;transform:scale(.6);pointer-events:none}
.tile.dead{background:#475569!important;filter:none;cursor:not-allowed}
.side h3{margin:.2rem 0 .6rem}
.log{font-size:.95rem;color:#475569;max-height:14rem;overflow:auto;background:#f8fafc;border-radius:.8rem;padding:.6rem .8rem}

/* ---------- modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:grid;place-items:center;padding:1rem}
.modal{background:#fff;border-radius:1.4rem;padding:1.6rem;width:min(1000px,96vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 .8rem;font-size:1.5rem}

/* ---------- wheel ---------- */
.wheel-wrap{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center}
.wheel-box{position:relative;width:min(34rem,44vw);aspect-ratio:1}
.wheel-box canvas{width:100%;height:100%}
.pointer{position:absolute;top:-.6rem;left:50%;transform:translateX(-50%);width:0;height:0;border-left:1.3rem solid transparent;border-right:1.3rem solid transparent;border-top:2.4rem solid #0f172a;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));z-index:2}
.wres{font-size:2rem;font-weight:900;margin-bottom:.6rem}
.prompt{font-size:1.6rem;font-weight:800;line-height:1.4;background:#f8fafc;border-radius:1rem;padding:1rem 1.2rem;margin:.6rem 0}
.hint{font-family:var(--jp);font-size:1.5rem;color:#166534;background:#f0fdf4;border-radius:1rem;padding:.8rem 1rem;margin:.6rem 0}

/* ---------- final ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.2rem;margin:2rem 0}
.pod{width:12rem;text-align:center}
.pod .bar{border-radius:1rem 1rem 0 0;display:grid;place-items:center;color:#fff;font-size:3rem;font-weight:900}
.pod .nm{font-size:1.5rem;font-weight:900;margin:.4rem 0}
.pod .pts{font-size:1.3rem;font-weight:800;color:var(--mut)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ---------- bổ sung: 1 người chơi, ghép hội thoại, gõ chữ ---------- */
.b-type{background:#cffafe;color:#155e75}.b-pts{background:#ede9fe;color:#5b21b6}
.menu-grid{grid-template-columns:repeat(4,1fr)}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;align-items:start}
.dlg h3{margin:.3rem 0 .6rem}
.dpool{display:flex;flex-direction:column;gap:.5rem;max-height:62vh;overflow:auto;padding:.3rem}
.dans{margin:0;padding-left:2.2rem;min-height:10rem;border:3px dashed #a5b4fc;border-radius:1rem;background:#f8fafc;padding-top:.6rem;padding-bottom:.6rem;padding-right:.6rem}
.dans li{margin:.35rem 0;font-weight:800;font-size:1.1rem;color:#4f46e5}
.dline{width:100%;text-align:left;padding:.65rem .9rem;border-radius:.8rem;background:#fff;border:3px solid #c7d2fe;font-size:1.35rem;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #e0e7ff}
.dline:hover:not(:disabled){border-color:#6366f1}
.dline{display:flex;align-items:center;gap:.7rem}
.dno{flex:none;min-width:2.2rem;height:2.2rem;border-radius:.6rem;background:#4f46e5;color:#fff;display:grid;place-items:center;font-size:1.15rem;font-weight:900;font-family:"Segoe UI",sans-serif}
.dline.in .dno{background:#94a3b8}
.dline.used{opacity:.3;pointer-events:none}
.dline.in{border-color:#6366f1;background:#eef2ff}
.dline.m-ok{border-color:#16a34a;background:#dcfce7}
.dline.m-pos{border-color:#f59e0b;background:#fef3c7}
.dline.m-bad{border-color:#dc2626;background:#fee2e2}
.fullbox{margin-top:1rem;background:#f0fdf4;border:2px solid #86efac;border-radius:1rem;padding:1rem 1.2rem;text-align:left}
.fl{display:grid;grid-template-columns:6.5rem 1fr 1fr;gap:1rem;padding:.35rem 0;border-bottom:1px dashed #bbf7d0;align-items:baseline}
.fl .sp{font-family:var(--jp);font-weight:900;color:#4f46e5;font-size:1.2rem}
.fl .jp{font-size:1.4rem;font-weight:800}
.fl .vi{color:#475569;font-size:1.05rem}
.ttable{width:100%;border-collapse:collapse}
.ttable td{padding:.5rem .6rem;border-bottom:1px solid #e2e8f0;vertical-align:top}
.ttable tr.sec td{background:#eef2ff;color:#3730a3;font-weight:900;font-size:1.1rem}
.ttable .no{width:2.5rem;font-weight:900;color:var(--mut);font-size:1.1rem}
.ttable .pr{width:38%;font-size:1.3rem;font-weight:800}
.rh{font-size:.95rem;color:#0e7490;font-weight:600;margin-top:.2rem}
.tin{width:100%;font-size:1.5rem;padding:.45rem .7rem;border-radius:.7rem;border:3px solid #cbd5e1;font-weight:700}
.tin:focus{outline:none;border-color:#6366f1}
.tin.ok{border-color:#16a34a;background:#f0fdf4}.tin.bad{border-color:#dc2626;background:#fef2f2}
.tres{font-size:1rem;margin-top:.3rem}
.trow{display:flex;gap:.5rem;align-items:center}.trow .tin{flex:1}
.tsub{flex:none;padding:.55rem 1rem;font-size:1.05rem;min-width:6.5rem}
.small{color:var(--mut);font-size:.9rem}
#ttext{width:100%;height:14rem;font-size:1rem;border-radius:.8rem;border:2px solid #cbd5e1;padding:.6rem;font-family:var(--jp)}
.sumt{margin:1rem auto;font-size:1.2rem;border-collapse:collapse;min-width:26rem}
.sumt td{padding:.35rem .8rem;border-bottom:1px solid #e2e8f0;text-align:left}
.chip{min-width:13rem}
.chip.active::after{display:none}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand" id="brand">🏯 Đấu trường Nihongo<small>Ôn tập Bài 3 · 4 · 5</small></div>
  <div id="scoreboard"></div>
  <div class="tools">
    <button id="btnMenu" title="Về menu">☰ Menu</button>
    <button id="btnSound" title="Bật/tắt âm thanh">🔊</button>
    <button id="btnFull" title="Toàn màn hình">⛶</button>
    <button id="btnFinal" title="Tổng kết">🏆</button>
  </div>
</header>
<main id="app"></main>
<div id="overlay" class="hidden"></div>
<canvas id="confetti"></canvas>

<script>
// ===== CÀI ĐẶT NỘP BÀI =====

const S={name:"",score:0,sound:true,done:new Set(),rp:{}};
let R=null,TIMERS=[];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function clearTimers(){TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t)});TIMERS=[]}
function later(fn,ms){const t=setTimeout(fn,ms);TIMERS.push(t);return t}
function prepMC(q){return {...q,opts:shuffle(q.o.map((t,k)=>({t,ok:k===0})))}}
const KEYS=["A","B","C","D"];

/* ---------- âm thanh ---------- */
let AC=null;
function tone(f,d,type="sine",vol=.15,when=0){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  ok(){tone(660,.15,"triangle");tone(880,.3,"triangle",.15,.12)},
  bad(){tone(180,.4,"sawtooth",.07)},
  tick(){tone(1100,.05,"square",.04)},
  flip(){tone(520,.07,"triangle",.08)},
  click(){tone(320,.03,"square",.03)},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,"triangle",.14,i*.14))},
};

/* ---------- điểm ---------- */
function renderScore(){
  $("#scoreboard").innerHTML=`<div class="chip" style="--c:#4f46e5">
    <div class="av">★</div>
    <div><div class="nm">${esc(S.name||"Điểm của em")}</div><div class="sc" id="sc">${S.score}</div></div>
    <div class="adj"><button data-adj="5" title="+5">＋</button><button data-adj="-5" title="−5">−</button></div></div>`;
}
$("#scoreboard").addEventListener("click",e=>{const a=e.target.closest("[data-adj]");if(a)addScore(+a.dataset.adj,true)});
function addScore(pts,manual){
  if(!pts)return;
  const before=S.score;S.score=Math.max(0,S.score+pts);const real=S.score-before;
  const key=manual?"bonus":(R&&R.id)||"bonus";S.rp[key]=(S.rp[key]||0)+real;
  renderScore();const chip=$(".chip");chip.classList.add("bump");
  const r=chip.getBoundingClientRect(),f=document.createElement("div");
  f.className="float";f.textContent=(pts>0?"+":"")+pts;f.style.color=pts>0?"#4f46e5":"#dc2626";
  f.style.left=(r.left+r.width/2-20)+"px";f.style.top=(r.top+10)+"px";document.body.appendChild(f);
  setTimeout(()=>f.remove(),1300);
}

function openModal(html){const o=$("#overlay");o.innerHTML=`<div class="modal">${html}</div>`;o.classList.remove("hidden");return o.firstElementChild}

function roundHead(icon,title,meta=""){return `<div class="round-head"><h2>${icon} ${title}</h2><div class="meta" id="meta">${meta}</div></div>`}
function endRound(id,msg,extra=""){
  S.done.add(id);sfx.win();
  show(`<div class="panel center" style="padding:3rem">
    <div style="font-size:4rem">🎉</div><h2 style="font-size:2.2rem;margin:.5rem 0">${msg||"Hết vòng!"}</h2>

      <button class="btn" id="toMenu">☰ Về menu chọn trò tiếp</button>

/* =====================================================================
   1 — ĐUA TỐC ĐỘ
   ===================================================================== */
const SPEED_TIME=20;
function startSpeed(){R={id:"speed",qs:shuffle(SPEED).slice(0,15).map(prepMC),i:0,right:0};speedQ()}
function speedQ(){
  const q=R.qs[R.i];R.over=false;R.time=SPEED_TIME;
  show(`<div class="panel">${roundHead("⚡","Đua tốc độ",`Câu ${R.i+1} / ${R.qs.length}`)}
    <div class="timer"><div class="bar" id="tbar"></div><span class="tnum" id="tnum">${R.time}s</span></div>
    <div class="qbox"><div class="tag">Bài ${q.b}</div><div class="q jp">${esc(q.q)}</div></div>
    <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${KEYS[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="nav"><button class="btn" id="next">Câu tiếp ▶</button></div></div>`);
  $$(".opt").forEach(o=>o.onclick=()=>speedPick(+o.dataset.k,o));
  $("#next").onclick=()=>{R.i++;R.i<R.qs.length?speedQ():endRound("speed","Hết vòng Đua tốc độ!",`<p style="font-size:1.2rem">Trả lời đúng ${R.right}/${R.qs.length} câu</p>`)};
  const t=setInterval(()=>{
    if(R.over)return;R.time--;
    $("#tbar").style.width=(R.time/SPEED_TIME*100)+"%";$("#tnum").textContent=R.time+"s";
    if(R.time<=5&&R.time>0)sfx.tick();
    if(R.time<=0){R.over=true;sfx.bad();speedShow();$("#fb").innerHTML=`<span class="fb-bad">⏰ Hết giờ!</span>${speedNote(q)}`}
  },1000);TIMERS.push(t);
}
const speedNote=q=>`<span class="note">Đáp án: <b class="jp">${esc(q.opts.find(o=>o.ok).t)}</b>${q.n?" · "+esc(q.n):""}</span>`;
function speedShow(){const q=R.qs[R.i];$$(".opt").forEach(o=>{o.disabled=true;if(q.opts[+o.dataset.k].ok)o.classList.add("right")})}
function speedPick(k,btn){
  const q=R.qs[R.i];if(R.over)return;R.over=true;
  if(q.opts[k].ok){
    const bonus=R.time>=SPEED_TIME-10?5:0;sfx.ok();addScore(10+bonus);R.right++;speedShow();
    $("#fb").innerHTML=`<span class="fb-ok">✔ Chính xác! +10${bonus?" (+5 thưởng tốc độ ⚡)":""}</span>${q.n?`<span class="note">${esc(q.n)}</span>`:""}`;
  }else{sfx.bad();btn.classList.add("wrong");speedShow();$("#fb").innerHTML=`<span class="fb-bad">✘ Chưa đúng!</span>${speedNote(q)}`}
}

function memMenu(){
  show(`<div class="panel">${roundHead("🃏","Lật thẻ ghép cặp")}
    <div class="rule">Mỗi lần lật 2 thẻ. Nếu là 1 cặp (tiếng Nhật ↔ nghĩa) → <b>+5</b>. Không trùng thì thẻ úp lại — nhớ vị trí thật kỹ! Hoàn thành bàn với ít hơn 14 lần lật được thưởng <b>+10</b>.</div>
    <h3>Chọn bộ thẻ:</h3>
    <div class="row">
      <button class="btn" data-set="3">Bài 3 – Nơi chốn</button>
      <button class="btn" data-set="4">Bài 4 – Ăn uống</button>
      <button class="btn" data-set="5">Bài 5 – Tính từ</button>
      <button class="btn gold" data-set="mix">🔀 Trộn cả 3 bài</button>
    </div></div>`);
  $$("[data-set]").forEach(b=>b.onclick=()=>startMem(b.dataset.set));
}
function startMem(set){
  const pool=set==="mix"?[...PAIRS[3],...PAIRS[4],...PAIRS[5]]:PAIRS[set];
  const cards=shuffle(shuffle(pool).slice(0,8).flatMap((p,id)=>[{id,t:p[0],jp:true},{id,t:p[1],jp:false}]));
  R={id:"mem",set,cards,open:[],matched:0,busy:false,moves:0};
  show(`<div class="panel">${roundHead("🃏","Lật thẻ ghép cặp",`Bộ: ${set==="mix"?"Trộn":"Bài "+set} · Số lần lật: <b id="moves">0</b>`)}
    <div class="mem" id="mem">${cards.map((c,i)=>`<div class="mc" data-i="${i}"><div class="face back">${i+1}</div><div class="face front ${c.jp?"jpw":""}">${esc(c.t)}</div></div>`).join("")}</div>
    <div class="nav"><button class="btn ghost" id="newb">↻ Bàn mới</button><button class="btn ghost" id="endm">Kết thúc</button></div></div>`);
  $$(".mc").forEach(el=>el.onclick=()=>memFlip(+el.dataset.i,el));
  $("#newb").onclick=()=>startMem(set);$("#endm").onclick=()=>endRound("mem","Hết vòng Lật thẻ!");
}
function memFlip(i,el){
  if(R.busy||el.classList.contains("open")||el.classList.contains("matched"))return;
  sfx.flip();el.classList.add("open");R.open.push(i);
  if(R.open.length<2)return;
  R.moves++;$("#moves").textContent=R.moves;
  const [a,b]=R.open;R.busy=true;
  const ea=$(`.mc[data-i="${a}"]`),eb=$(`.mc[data-i="${b}"]`);
  if(R.cards[a].id===R.cards[b].id){
    later(()=>{sfx.ok();[ea,eb].forEach(e=>{e.classList.remove("open");e.classList.add("matched");e.style.setProperty("--mc","#4f46e5")});
      addScore(5);R.open=[];R.busy=false;R.matched++;
      if(R.matched===8){if(R.moves<14)addScore(10);later(()=>endRound("mem","Đã lật hết bàn thẻ!",`<p style="font-size:1.2rem">Số lần lật: ${R.moves}${R.moves<14?" — thưởng +10 trí nhớ siêu tốt! 🧠":""}</p>`),1200)}
    },450);
  }else{
    later(()=>{sfx.bad();[ea,eb].forEach(e=>e.classList.add("shake"))},700);
    later(()=>{[ea,eb].forEach(e=>e.classList.remove("open","shake"));R.open=[];R.busy=false},1600);
  }
}

const ATTACH=new Set(["は","が","を","に","へ","で","と","の","か","です"]);
function jpJoin(t){return t.reduce((a,x,i)=>a+(i&&!ATTACH.has(x)?" ":"")+x,"")}
function startOrder(){R={id:"ord",qs:shuffle(ORDER).slice(0,10),i:0};ordQ()}
function ordQ(){
  const q=R.qs[R.i];const toks=q.t.map(t=>({t}));if(q.d)toks.push({t:q.d,trap:true});
  R.pool=shuffle(toks).map((x,u)=>({...x,u}));R.ans=[];R.tries=0;R.over=false;
  show(`<div class="panel">${roundHead("🧩","Xếp câu",`Câu ${R.i+1} / ${R.qs.length} · Bài ${q.b}`)}
    <div class="ord-vi">🇻🇳 ${esc(q.vi)}</div>
    <div class="slots" id="slots"></div><div class="pool" id="pool"></div>
    <div class="center" style="color:#b45309;font-weight:700">⚠ Có thể có 1 mảnh BẪY không dùng tới!</div>
    <div class="feedback" id="fb"></div>
    <div class="nav"><button class="btn ghost" id="clr">✖ Xoá hết</button><button class="btn ok" id="chk">✔ Kiểm tra</button><button class="btn hidden" id="next">Câu tiếp ▶</button></div></div>`);
  ordDraw();
  $("#clr").onclick=()=>{if(R.over)return;R.ans=[];ordDraw()};
  $("#chk").onclick=ordCheck;
  $("#next").onclick=()=>{R.i++;R.i<R.qs.length?ordQ():endRound("ord","Hết vòng Xếp câu!")};
}
function ordDraw(){
  const used=new Set(R.ans);$("#slots").className="slots";
  $("#slots").innerHTML=R.ans.length?R.ans.map(u=>`<button class="tok" data-u="${u}">${esc(R.pool[u].t)}</button>`).join("")+`<span class="tok" style="border-color:transparent;box-shadow:none;background:none">。</span>`:`<span class="ph">Bấm vào các mảnh bên dưới để xếp câu…</span>`;
  $("#pool").innerHTML=R.pool.map(p=>`<button class="tok ${used.has(p.u)?"used":""}" data-u="${p.u}">${esc(p.t)}</button>`).join("");
  $$("#pool .tok").forEach(b=>b.onclick=()=>{if(R.over)return;sfx.click();R.ans.push(+b.dataset.u);ordDraw()});
  $$("#slots .tok[data-u]").forEach(b=>b.onclick=()=>{if(R.over)return;sfx.click();R.ans=R.ans.filter(u=>u!==+b.dataset.u);ordDraw()});
}
function ordCheck(){
  if(R.over||!R.ans.length)return;

function startDet(){
  const errs=shuffle(DET.filter(d=>d.k==="err")),mcs=shuffle(DET.filter(d=>d.k==="mc")),qs=[];
  while(qs.length<12&&(errs.length||mcs.length)){if(errs.length)qs.push(errs.pop());if(qs.length<12&&mcs.length)qs.push(mcs.pop())}
  R={id:"det",qs:qs.map(q=>q.k==="mc"?prepMC(q):q),i:0};detQ();
}
function isErrRight(q,k){return Array.isArray(q.w)?q.w.includes(k):q.w===k}
function detQ(){
  const q=R.qs[R.i];R.over=false;
  const body=q.k==="err"
    ?`<div class="qbox"><div class="tag">Bài ${q.b} · 🔍 Tìm chỗ SAI</div>${q.ctx?`<div class="ctx jp">${esc(q.ctx)}</div>`:""}
       <div class="parts">${q.p.map((t,k)=>`<button class="part" data-k="${k}">${esc(t)}</button>`).join("")}</div>
       <div style="color:var(--mut);margin-top:.5rem">Bấm vào phần bị SAI trong câu</div></div>`
    :`<div class="qbox"><div class="tag">Bài ${q.b} · 🎯 Chọn đúng theo tình huống</div><div class="ctx">${esc(q.ctx)}</div><div class="q jp">${esc(q.q)}</div></div>
       <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${KEYS[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  show(`<div class="panel">${roundHead("🕵️","Thám tử ngữ pháp",`Câu ${R.i+1} / ${R.qs.length}`)}${body}
    <div class="feedback" id="fb"></div><div id="fix"></div>
    <div class="nav"><button class="btn hidden" id="next">Câu tiếp ▶</button></div></div>`);
  if(q.k==="err")$$(".part").forEach(b=>b.onclick=()=>detAns(isErrRight(q,+b.dataset.k),b));
  else $$(".opt").forEach(b=>b.onclick=()=>detAns(q.opts[+b.dataset.k].ok,b));
  $("#next").onclick=()=>{R.i++;R.i<R.qs.length?detQ():endRound("det","Hết vòng Thám tử!")};
}
function detAns(ok,btn){
  if(R.over)return;R.over=true;const q=R.qs[R.i];
  $$(".part,.opt").forEach(b=>b.disabled=true);
  if(ok){sfx.ok();addScore(10);$("#fb").innerHTML=`<span class="fb-ok">✔ Giỏi quá! +10</span>`}
  else{sfx.bad();btn.classList.add("wrong");$("#fb").innerHTML=`<span class="fb-bad">✘ Chưa đúng! Cùng xem đáp án nhé 👇</span>`}
  if(q.k==="err"){
    $$(".part").forEach(b=>{if(isErrRight(q,+b.dataset.k)){b.classList.remove("wrong");b.classList.add("right")}});
    $("#fix").innerHTML=`<div class="fixbox">✅ Câu đúng: <span class="jp">${esc(q.fix)}</span><br>💡 ${esc(q.why)}</div>`;
  }else{
    $$(".opt").forEach(b=>{if(q.opts[+b.dataset.k].ok)b.classList.add("right")});
    $("#fix").innerHTML=`<div class="fixbox">💡 ${esc(q.why)}</div>`;
  }

function startWheel(){
  R={id:"wheel",rot:0,spinning:false,pool:shuffle(WHEELQ),hard:shuffle(WHEELHARD)};
  show(`<div class="panel">${roundHead("🎡","Vòng quay may mắn")}
    <div class="wheel-wrap">
      <div class="wheel-box"><div class="pointer"></div><canvas id="wc" width="800" height="800"></canvas></div>
      <div><div id="wpanel"></div>
        <div class="rule" style="margin-top:1rem">Quay trúng điểm → nhận 1 thử thách NÓI. Thầy chấm Đúng thì được điểm đó.<br><b>★ +40</b>: thử thách khó · <b>Quay lại</b>: được quay lần nữa · <b>Bỏ qua</b>: không có điểm.</div>
        <div class="nav" style="justify-content:flex-start"><button class="btn ghost" id="endw">Kết thúc</button></div>
      </div></div></div>`);
  drawWheel(0);spinBtn();$("#endw").onclick=()=>endRound("wheel","Hết vòng quay!");
}
function spinBtn(label="🎡 QUAY!"){$("#wpanel").innerHTML=`<button class="btn gold" id="spin" style="font-size:1.6rem;padding:1rem 2rem">${label}</button>`;$("#spin").onclick=spin}
function drawWheel(rot){
  const c=$("#wc");if(!c)return;const g=c.getContext("2d"),n=SEGS.length,R0=390,cx=400,cy=400,arc=2*Math.PI/n;
  g.clearRect(0,0,800,800);
  SEGS.forEach((s,i)=>{
    const a0=rot+i*arc-Math.PI/2;
    g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R0,a0,a0+arc);g.closePath();g.fillStyle=s.c;g.fill();g.lineWidth=6;g.strokeStyle="#fff";g.stroke();
    const mid=a0+arc/2,flip=Math.cos(mid)<0;
    g.save();g.translate(cx,cy);g.rotate(flip?mid+Math.PI:mid);g.textAlign=flip?"left":"right";g.fillStyle="#fff";
    g.font="900 52px Segoe UI, sans-serif";g.shadowColor="rgba(0,0,0,.35)";g.shadowBlur=6;g.fillText(s.t,flip?-(R0-30):R0-30,18);g.restore();
  });
  g.beginPath();g.arc(cx,cy,60,0,2*Math.PI);g.fillStyle="#0f172a";g.fill();g.lineWidth=8;g.strokeStyle="#fff";g.stroke();
  g.fillStyle="#fff";g.font="900 40px Segoe UI";g.textAlign="center";g.fillText("★",cx,cy+14);
}
function spin(){
  if(R.spinning)return;R.spinning=true;$("#spin").disabled=true;
  const n=SEGS.length,arc=2*Math.PI/n,target=Math.floor(Math.random()*n),TAU=2*Math.PI;
  const want=((-(target*arc+arc/2)+(Math.random()-.5)*arc*.7)%TAU+TAU)%TAU;
  const final=R.rot-(R.rot%TAU)+TAU*(6+Math.floor(Math.random()*2))+want;
  const start=R.rot,dur=4200,t0=performance.now();let last=-1;
  (function frame(now){
    const t=Math.min(1,(now-t0)/dur),rot=start+(final-start)*(1-Math.pow(1-t,4));drawWheel(rot);
    const seg=Math.floor((((-rot)%TAU)+TAU)%TAU/arc);if(seg!==last){sfx.click();last=seg}
    if(t<1)requestAnimationFrame(frame);else{R.rot=rot;R.spinning=false;wheelResult(target)}
  })(t0);
}
function takeQ(hard){const key=hard?"hard":"pool";if(!R[key].length)R[key]=shuffle(hard?WHEELHARD:WHEELQ);return R[key].pop()}
function wheelResult(i){
  const s=SEGS[i],p=$("#wpanel");
  if(s.k==="lose"){sfx.bad();p.innerHTML=`<div class="wres" style="color:#64748b">😅 Bỏ qua lượt này!</div><button class="btn" id="wn">Quay tiếp ▶</button>`;$("#wn").onclick=()=>spinBtn();return}
  if(s.k==="again"){sfx.ok();spinBtn("🔄 Được QUAY LẠI!");return}
  sfx.ok();const q=takeQ(s.k==="star");
  p.innerHTML=`<div class="wres" style="color:${s.c}">${s.k==="star"?"★ Thử thách KHÓ: +40":`🎁 ${s.t} điểm`}</div>
    <div class="prompt">🗣️ ${esc(q.q)}</div>
    <div class="row"><button class="btn ghost" id="whint">👁 Xem đáp án gợi ý</button></div>
    <div class="hint hidden" id="wh">${esc(q.a)}</div>
    <div class="row" style="margin-top:.8rem"><button class="btn ok" id="wok">✔ Đúng</button><button class="btn bad" id="wno">✘ Sai</button></div>`;
  $("#whint").onclick=()=>$("#wh").classList.remove("hidden");
  const done=()=>{$("#wh").classList.remove("hidden");$("#wok").disabled=$("#wno").disabled=true;
    p.insertAdjacentHTML("beforeend",`<div class="nav" style="justify-content:flex-start"><button class="btn" id="wn">Quay tiếp ▶</button></div>`);$("#wn").onclick=()=>spinBtn()};
  $("#wok").onclick=()=>{sfx.ok();addScore(s.v);done()};
  $("#wno").onclick=()=>{sfx.bad();done()};
}

/* =====================================================================
   7 — BÀI TẬP GÕ TIẾNG NHẬT (nộp từng câu)
   ===================================================================== */
const TYPE_ANS={},TYPE_ST={};   // chữ em đã gõ · trạng thái từng câu {tries,ok,v,sent}
let TYPE_AWARDED=new Set();
function normJP(s){return String(s).normalize("NFKC").replace(/[\s　]/g,"").replace(/[。．.！!？?、，,・]/g,"")}
function typeOK(it,v){const n=normJP(v);return !!n&&[it.a,...(it.alt||[])].some(a=>normJP(a)===n)}
const CAN_SEND=()=>/^https?:\/\//.test(SHEET_URL);
async function sendRow(payload){
  try{const r=await fetch(SHEET_URL,{method:"POST",body:JSON.stringify(payload)});const j=await r.json();if(!j.ok)throw new Error(j.error);return true}
  catch(e){try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});return true}catch(e2){return false}}
}
function startTyping(){
  R={id:"type"};
  const lbl=CAN_SEND()?"📤 Nộp":"✔ Chấm";let sec="";
  const rows=TYPING.map((it,i)=>{
    const head=it.sec!==sec?`<tr class="sec"><td colspan="3">${esc(sec=it.sec)}</td></tr>`:"";
    return head+`<tr data-i="${i}"><td class="no">${i+1}</td>
      <td class="pr">${esc(it.p)}<div class="rh hidden">⌨ ${esc(it.r)}</div></td>
      <td><div class="trow"><input class="tin jp" data-i="${i}" lang="ja" autocomplete="off" spellcheck="false" value="${esc(TYPE_ANS[i]||"")}">
        <button class="btn tsub" data-i="${i}">${TYPE_ST[i]?.tries?"↻ "+lbl.slice(2)+" lại":lbl}</button></div>
        <div class="tres" id="tr${i}"></div></td></tr>`;
  }).join("");
  show(`<div class="panel">${roundHead("⌨️","Bài tập gõ tiếng Nhật",`<span id="tprog"></span>`)}
    <div class="rule">
      <b>Cách gõ:</b> bật bàn phím tiếng Nhật (Windows: <b>Alt + ~</b> hoặc chọn <b>あ</b> ở góc phải thanh Taskbar) → gõ chữ Latinh, máy sẽ ra Hiragana.<br>
      • <b>ん</b> = gõ <b>nn</b> · chữ nhỏ <b>っ</b> = gõ đôi phụ âm (<b>mittsu</b> → みっつ) · dấu <b>ー</b> = phím <b>-</b><br>
      • Muốn ra <b>Katakana</b> (ドン, ケーキ…): gõ xong bấm <b>F7</b> · Muốn ra <b>Kanji</b>: bấm <b>Space</b> để chọn chữ.<br>
      • Phần số tiền: gõ <b>cách ĐỌC</b> bằng chữ, không gõ chữ số.<br>
      • <b>Làm câu nào nộp câu đó</b>: gõ xong bấm nút <b>${lbl}</b> (hoặc phím Enter). Sai thì sửa rồi nộp lại — thầy xem lần nộp mới nhất.</div>
    <div class="row" style="margin-bottom:1rem">
      <label style="font-weight:800;font-size:1.15rem">Tên học sinh: <input id="tname" value="${esc(S.name)}" placeholder="Ghi tên trước khi làm bài" style="font-size:1.15rem;padding:.45rem .8rem;border-radius:.6rem;border:3px solid #a5b4fc"></label>
      <button class="btn ghost" id="thint">💡 Hiện / ẩn gợi ý cách gõ</button>
    </div>
    <table class="ttable"><tbody>${rows}</tbody></table>
    <div class="feedback" id="tfb"></div>
    <div class="nav"><button class="btn gold" id="tcopy">📋 Sao chép kết quả gửi nhóm chat</button>
      ${STUDENT_MODE?"":`<button class="btn ghost" id="tend">Xong ▶</button>`}</div>
    <div id="tout" class="hidden"><p style="color:var(--mut)">Nếu nút sao chép không chạy: bôi đen toàn bộ khung dưới → Ctrl+C → dán vào nhóm chat.</p><textarea id="ttext" readonly></textarea></div>
  </div>`);
  TYPING.forEach((_,i)=>typeShow(i));typeProg();
  $$(".tin").forEach(inp=>{
    inp.oninput=()=>{TYPE_ANS[+inp.dataset.i]=inp.value;inp.classList.remove("ok","bad")};
    inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing&&e.keyCode!==229){e.preventDefault();typeSubmitOne(+inp.dataset.i)}};
  });
  $$(".tsub").forEach(b=>b.onclick=()=>typeSubmitOne(+b.dataset.i));
  $("#thint").onclick=()=>$$(".rh").forEach(x=>x.classList.toggle("hidden"));
  $("#tname").oninput=e=>{S.name=e.target.value.trim();renderScore()};
  $("#tcopy").onclick=typeCopy;
  if(!STUDENT_MODE)$("#tend").onclick=()=>endRound("type","Hoàn thành bài tập gõ!");
}
function typeShow(i){
  const st=TYPE_ST[i],inp=$(`.tin[data-i="${i}"]`),out=$("#tr"+i);if(!st||!st.tries){out.innerHTML="";return}
  const same=normJP(inp.value)===normJP(st.v);
  if(same){inp.classList.toggle("ok",st.ok);inp.classList.toggle("bad",!st.ok)}
  const when=st.sent?` · <span class="small">📤 đã nộp ${st.sent}</span>`:st.fail?` · <span class="fb-bad">⚠ chưa gửi được — bấm nộp lại</span>`:"";
  out.innerHTML=st.ok?`<span class="fb-ok">✔ Đúng rồi!</span>${when}`
    :`<span class="fb-bad">✘ Chưa đúng — sửa lại rồi nộp lần nữa</span>${when}${st.tries>=2?`<div class="rh">💡 Gợi ý cách gõ: ${esc(TYPING[i].r)}</div>`:""}`;
}
function typeProg(){
  const sts=Object.values(TYPE_ST).filter(s=>s.tries),ok=sts.filter(s=>s.ok).length;
  if($("#tprog"))$("#tprog").innerHTML=`Đã làm <b>${sts.length}</b>/${TYPING.length} · Đúng <b style="color:var(--ok)">${ok}</b>`;
}
async function typeSubmitOne(i){
  const it=TYPING[i],inp=$(`.tin[data-i="${i}"]`),btn=$(`.tsub[data-i="${i}"]`),v=inp.value.trim(),out=$("#tr"+i);
  if(!normJP(v)){out.innerHTML=`<span class="fb-bad">Em chưa gõ gì cả!</span>`;inp.focus();return}
  const name=$("#tname").value.trim();
  if(CAN_SEND()&&!name){alert("Em hãy ghi TÊN trước khi nộp bài nhé!");$("#tname").focus();return}
  if(btn.disabled)return;
  const ok=typeOK(it,v),st=TYPE_ST[i]=TYPE_ST[i]||{tries:0};
  st.tries++;st.ok=ok;st.v=v;st.sent=null;st.fail=false;
  ok?sfx.ok():sfx.bad();
  if(ok&&!TYPE_AWARDED.has(i)){TYPE_AWARDED.add(i);addScore(5)}
  typeShow(i);typeProg();
  if(ok){const nx=$(`.tin[data-i="${i+1}"]`);if(nx&&!TYPE_ST[i+1]?.ok)nx.focus()}
  if(!CAN_SEND()){btn.textContent="↻ Chấm lại";return}
  btn.disabled=true;btn.textContent="⏳";
  const good=await sendRow({name,qno:i+1,q:it.p,v,ok,a:it.a,tries:st.tries});
  btn.disabled=false;btn.textContent="↻ Nộp lại";
  if(TYPE_ST[i]!==st||st.v!==v)return;
  if(good)st.sent=new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});else st.fail=true;
  typeShow(i);
}
function typeText(){
  const name=($("#tname").value||"").trim()||"(chưa ghi tên)",d=new Date();
  const ok=TYPING.filter((_,i)=>TYPE_ST[i]?.ok).length;
  const lines=TYPING.map((it,i)=>{const st=TYPE_ST[i];return `${i+1}. ${it.p} → ${st?.v||"(chưa làm)"} ${st?.tries?(st.ok?"✅":"❌"):""}`});
  return `📝 BÀI TẬP GÕ TIẾNG NHẬT – Ôn tập Bài 3·4·5\n👤 Học sinh: ${name}\n📅 ${d.toLocaleDateString("vi-VN")} ${d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}\n🎯 Kết quả: ${ok}/${TYPING.length} câu đúng\n────────────\n${lines.join("\n")}`;
}
function typeCopy(){
  const txt=typeText(),ta=$("#ttext");ta.value=txt;$("#tout").classList.remove("hidden");
  const okMsg=()=>{$("#tcopy").textContent="✅ Đã sao chép! Dán (Ctrl+V) vào nhóm chat";sfx.ok()};
  const fallback=()=>{ta.focus();ta.select();try{document.execCommand("copy")?okMsg():0}catch(e){}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(okMsg,fallback);else fallback();
}

/* =====================================================================
   TỔNG KẾT
   ===================================================================== */
function final(){
  const rows=ROUNDS.map(r=>`<tr><td>${r.ic} ${r.t}</td><td style="text-align:right"><b>${S.rp[r.id]||0}</b></td></tr>`).join("")
    +(S.rp.bonus?`<tr><td>⭐ Điểm thưởng của thầy</td><td style="text-align:right"><b>${S.rp.bonus}</b></td></tr>`:"");
  const stars=S.score>=400?3:S.score>=200?2:S.score>=80?1:0;
  show(`<div class="panel center">
    <h2 style="font-size:2.4rem;margin:.2rem">🏆 Tổng kết Đấu trường Nihongo 🏆</h2>
    <div style="font-size:4rem;letter-spacing:.5rem;margin:.6rem 0">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    
    <div style="font-size:4.5rem;font-weight:900;color:var(--pri);line-height:1.1">${S.score} <span style="font-size:1.8rem">điểm</span></div>
    <table class="sumt">${rows}</table>
    <p style="font-size:1.3rem">よくできました！ Em đã làm rất tốt! 🎌</p>
    <div class="row" style="justify-content:center;margin-top:1rem">
      <button class="btn" id="fm">☰ Chơi tiếp (giữ điểm)</button>
      <button class="btn ghost" id="fr">↻ Chơi lại từ đầu (về 0 điểm)</button>
    </div></div>`);
  sfx.win();confetti();
  $("#fm").onclick=goMenu;
  $("#fr").onclick=()=>{if(confirm("Đặt lại toàn bộ điểm về 0?")){S.score=0;S.rp={};S.done.clear();TYPE_AWARDED=new Set();for(const k in DLG_DONE)delete DLG_DONE[k];renderScore();goMenu()}};
}
function confetti(){
  const c=$("#confetti"),g=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:["#ef4444","#3b82f6","#22c55e","#f59e0b","#a855f7","#ec4899"][Math.floor(Math.random()*6)]}));
  const t0=performance.now();
  (function f(now){g.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.col;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});
    if(now-t0<5000)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})(t0);
}

/* ---------- thanh công cụ ---------- */
$("#btnMenu").onclick=goMenu;$("#brand").onclick=goMenu;$("#btnFinal").onclick=final;
$("#btnSound").onclick=()=>{S.sound=!S.sound;$("#btnSound").textContent=S.sound?"🔊":"🔇"};
$("#btnFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
window.addEventListener("beforeunload",e=>{if(S.score>0){e.preventDefault();e.returnValue=""}});
if(STUDENT_MODE){document.title="Bài tập gõ tiếng Nhật – Bài 3·4·5";$("#topbar").classList.add("hidden");startTyping()}
else{$("#topbar").classList.remove("hidden");renderScore();goMenu()}

</script>
