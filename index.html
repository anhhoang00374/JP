<body>
<div class="app-shell">
  <header class="app-header">
    <div>
      <h1>🎌 Bài 2: Lớp học và vị trí đồ vật</h1>
      <p>Bài tập Bài 2 — luyện tư duy ngữ pháp (tự làm & tự chấm)</p>
    </div>
    <div class="score-badge">⭐ <span id="score-display">0</span>/<span id="score-total">0</span></div>
  </header>
  <nav class="tab-bar" id="tab-bar"></nav>
  <main class="content" id="app"></main>
</div>

<script src="on-tap-bai-02.data.js"></script>

<script>
const DATA = window.EXERCISE_DATA;
let totalScore = 0, totalMax = 0;
let qCounter = 0;

function bumpMax(n) { totalMax += n; document.getElementById('score-total').textContent = totalMax; }
function addScore(n) { totalScore += n; document.getElementById('score-display').textContent = totalScore; }
function nextNum() { qCounter += 1; return qCounter; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function burstConfetti(opts) {
  try {
    if (window.confetti) confetti(Object.assign({ particleCount: 40, spread: 60, origin: { y: 0.7 } }, opts || {}));
  } catch (e) {}
}

function makeController() {
  const cbs = [];
  return {
    onChange(cb) { cbs.push(cb); },
    notify() { cbs.forEach(cb => cb()); }
  };
}

const NO_SUBMIT_TYPES = new Set(['dialogue_practice', 'dialogue_translation', 'translation', 'translation_vi_jp', 'translation_jp_vi', 'vocab_flashcard', 'kanji_flashcard', 'sentence_transform']);

const RENDERERS = {};

RENDERERS.multiple_choice = function (section, container) {
  const ctrl = makeController();
  const state = [];
  section.items.forEach(item => {
    bumpMax(1);
    const n = nextNum();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="q-num">Câu ' + n + '</div><div class="jp jp-q">' + item.question + '</div><div class="options"></div><div class="feedback"></div>';
    const optsDiv = div.querySelector('.options');
    const fb = div.querySelector('.feedback');
    const rec = { selected: null, buttons: [] };
    item.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt'; btn.textContent = opt;
      btn.onclick = () => {
        rec.selected = i;
        rec.buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        ctrl.notify();
      };
      rec.buttons.push(btn);
      optsDiv.appendChild(btn);
    });
    state.push({ item, rec, fb });
    container.appendChild(div);
  });
  ctrl.isComplete = () => state.every(s => s.rec.selected !== null);
  ctrl.grade = () => {
    let correct = 0;
    state.forEach(({ item, rec, fb }) => {
      rec.buttons.forEach(b => b.dataset.done = '1');
      if (rec.selected === item.answer_index) {
        rec.buttons[rec.selected].classList.add('correct');
        fb.textContent = 'Chính xác.'; fb.className = 'feedback ok';
        addScore(1); correct++;
      } else {
        rec.buttons[rec.selected].classList.add('wrong');
        rec.buttons[item.answer_index].classList.add('correct');
        fb.textContent = 'Chưa đúng, đáp án đúng đã tô xanh.'; fb.className = 'feedback no';
      }
    });
    return { correct, total: state.length };
  };
  return ctrl;
};

RENDERERS.fill_blank = function (section, container) {
  const ctrl = makeController();
  const state = [];

RENDERERS.matching = function (section, container) {
  const ctrl = makeController();
  const div = document.createElement('div');
  div.className = 'card';
  const n = section.items.length;
  const PAIR_COLORS = 8;

  // order[slot] = original item index whose "right" text is displayed at that slot.
  const order = shuffle(section.items.map((_, i) => i));
  // correctSlotForLeft[leftIdx] = the slot index that is the right answer for that left row.
  const correctSlotForLeft = new Array(n);
  order.forEach((origIdx, slot) => { correctSlotForLeft[origIdx] = slot; });

  // Current mapping state (both directions kept in sync).
  const leftToRight = new Array(n).fill(null);
  const rightToLeft = new Array(n).fill(null);
  let selected = null; // { col: 'left'|'right', idx: number } or null
  let graded = false;

  let leftHtml = '';
  section.items.forEach((item, idx) => {
    leftHtml += '<div class="match-row" data-left-idx="' + idx + '"><span class="q-num-mini">' + (idx + 1) + '</span><span class="jp">' + item.left + '</span></div>';
  });
  let rightHtml = '';
  order.forEach((origIdx, slot) => {
    const item = section.items[origIdx];
    rightHtml += '<div class="match-row pill" data-slot-idx="' + slot + '">' + item.right + '</div>';
  });
  div.innerHTML = '<div class="match-wrap">' +
      '<div class="match-col match-left">' + leftHtml + '</div>' +
      '<div class="match-col match-right">' + rightHtml + '</div>' +
    '</div>' +
    '<div class="feedback"></div>';
  bumpMax(n);

  const leftRows = [...div.querySelectorAll('.match-left .match-row')];
  const rightRows = [...div.querySelectorAll('.match-right .match-row')];
  const fb = div.querySelector('.feedback');

  function clearPairClasses(row) {
    for (let i = 0; i < PAIR_COLORS; i++) row.classList.remove('match-pair-' + i);
    row.classList.remove('match-matched', 'match-selecting', 'match-partner-highlight');
  }

  function render() {
    // If the active selection already has an existing partner (the "reselecting an
    // already-matched cell" case), highlight that partner so it's obvious which
    // item it's currently linked to.
    let partnerRow = null;
    if (selected) {
      if (selected.col === 'left' && leftToRight[selected.idx] !== null) {
        partnerRow = rightRows[leftToRight[selected.idx]];
      } else if (selected.col === 'right' && rightToLeft[selected.idx] !== null) {
        partnerRow = leftRows[rightToLeft[selected.idx]];
      }
    }
    leftRows.forEach((row, idx) => {
      clearPairClasses(row);
      if (leftToRight[idx] !== null) {
        row.classList.add('match-matched', 'match-pair-' + (idx % PAIR_COLORS));
      }
      if (selected && selected.col === 'left' && selected.idx === idx) {
        row.classList.add('match-selecting');
      }
      if (row === partnerRow) row.classList.add('match-partner-highlight');
    });
    rightRows.forEach((row, slot) => {
      clearPairClasses(row);
      const leftIdx = rightToLeft[slot];
      if (leftIdx !== null) {
        row.classList.add('match-matched', 'match-pair-' + (leftIdx % PAIR_COLORS));
      }
      if (selected && selected.col === 'right' && selected.idx === slot) {
        row.classList.add('match-selecting');
      }
      if (row === partnerRow) row.classList.add('match-partner-highlight');
    });
  }

  function selectCell(col, idx) {
    if (graded) return;
    if (selected && selected.col === col && selected.idx === idx) {
      // Re-clicking the same active selection cancels it.
      selected = null;
      render();
      return;
    }
    if (selected && selected.col !== col) {
      // Two different columns selected -> form (or replace) a pairing.
      const leftIdx = col === 'left' ? idx : selected.idx;
      const slotIdx = col === 'right' ? idx : selected.idx;
      if (leftToRight[leftIdx] !== null) rightToLeft[leftToRight[leftIdx]] = null;
      if (rightToLeft[slotIdx] !== null) leftToRight[rightToLeft[slotIdx]] = null;
      leftToRight[leftIdx] = slotIdx;
      rightToLeft[slotIdx] = leftIdx;
      selected = null;
      render();
      ctrl.notify();
      return;
    }
    // Nothing selected yet, or clicking a different cell in the same column:
    // just move the active selection here. Any existing pairing on this cell
    // (if it was already matched) stays untouched until a new pairing completes.
    selected = { col, idx };
    render();
  }

  leftRows.forEach((row, idx) => row.addEventListener('click', () => selectCell('left', idx)));
  rightRows.forEach((row, slot) => row.addEventListener('click', () => selectCell('right', slot)));

  ctrl.isComplete = () => leftToRight.every(v => v !== null);
  ctrl.grade = () => {
    graded = true;
    selected = null;
    let correct = 0;
    leftRows.forEach((row, leftIdx) => {
      const userSlot = leftToRight[leftIdx];
      const isRight = userSlot === correctSlotForLeft[leftIdx];
      row.classList.add('match-graded', isRight ? 'match-correct' : 'match-wrong');
      if (userSlot !== null) rightRows[userSlot].classList.add('match-graded', isRight ? 'match-correct' : 'match-wrong');
      if (isRight) correct++;
    });
    render();
    addScore(correct);
    if (correct === n) { fb.textContent = 'Tuyệt vời, đúng hết.'; fb.className = 'feedback ok'; }
    else { fb.textContent = 'Đúng ' + correct + '/' + n + '.'; fb.className = 'feedback no'; }
    return { correct, total: n };
  };

  render();
  container.appendChild(div);
  return ctrl;
};

RENDERERS.sentence_ordering = function (section, container) {
  const ctrl = makeController();
  const state = [];
  section.items.forEach(item => {
    bumpMax(1);
    const n = nextNum();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="q-num">Câu ' + n + '</div>' +
      '<div>Sắp xếp thành câu đúng (nghĩa: ' + item.meaning_vi + '):</div>' +
      '<div class="order-tokens"></div>' +
      '<div class="order-built"></div>' +
      '<div><button class="reveal-btn reset-btn">Làm lại</button></div>' +
      '<div class="feedback"></div>';
    const tokensDiv = div.querySelector('.order-tokens');
    const builtDiv = div.querySelector('.order-built');
    const fb = div.querySelector('.feedback');
    let built = [];
    function renderTokens() {
      tokensDiv.innerHTML = '';
      shuffle(item.tokens).forEach(tok => {
        const btn = document.createElement('button');
        btn.textContent = tok;
        btn.onclick = () => {
          if (btn.dataset.used) return;
          btn.dataset.used = '1';
          btn.style.visibility = 'hidden';
          built.push(tok);
          builtDiv.textContent = built.join('');
          ctrl.notify();
        };
        tokensDiv.appendChild(btn);
      });
    }
    renderTokens();
    div.querySelector('.reset-btn').onclick = () => { built = []; builtDiv.textContent = ''; renderTokens(); ctrl.notify(); };
    state.push({ item, getBuilt: () => built, fb });
    container.appendChild(div);
  });
  ctrl.isComplete = () => state.every(s => s.getBuilt().length === s.item.tokens.length);
  ctrl.grade = () => {
    let correct = 0;
    state.forEach(({ item, getBuilt, fb }) => {
      if (getBuilt().join('') === item.tokens.join('')) { fb.textContent = 'Chính xác.'; fb.className = 'feedback ok'; addScore(1); correct++; }
      else { fb.textContent = 'Chưa đúng. Câu đúng: ' + item.tokens.join(''); fb.className = 'feedback no'; }
    });
    return { correct, total: state.length };
  };
  return ctrl;
};

RENDERERS.reading_comprehension = function (section, container) {
  const ctrl = makeController();
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<div class="passage jp">' + section.passage + '</div>';
  const state = [];
  section.questions.forEach(q => {
    bumpMax(1);
    const n = nextNum();
    const qDiv = document.createElement('div');
    qDiv.className = 'card';
    qDiv.innerHTML = '<div class="q-num">Câu ' + n + '</div><div class="jp jp-q">' + q.question + '</div><div class="options"></div><div class="feedback"></div>';
    const optsDiv = qDiv.querySelector('.options');
    const fb = qDiv.querySelector('.feedback');
    const rec = { selected: null, buttons: [] };
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt'; btn.textContent = opt;
      btn.onclick = () => {
        rec.selected = i;
        rec.buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        ctrl.notify();
      };
      rec.buttons.push(btn);
      optsDiv.appendChild(btn);
    });
    state.push({ q, rec, fb });
    div.appendChild(qDiv);
  });
  ctrl.isComplete = () => state.every(s => s.rec.selected !== null);
  ctrl.grade = () => {
    let correct = 0;
    state.forEach(({ q, rec, fb }) => {
      rec.buttons.forEach(b => b.dataset.done = '1');
      if (rec.selected === q.answer_index) {
        rec.buttons[rec.selected].classList.add('correct');
        fb.textContent = 'Chính xác.'; fb.className = 'feedback ok'; addScore(1); correct++;
      } else {
        rec.buttons[rec.selected].classList.add('wrong');
        rec.buttons[q.answer_index].classList.add('correct');
        fb.textContent = 'Chưa đúng.'; fb.className = 'feedback no';
      }
    });
    return { correct, total: state.length };
  };
  container.appendChild(div);
  return ctrl;
};

// Hien thi tung item mot (nhu flashcard) + nut tien/lui, dung cho cac dang bai
// khong co "mat truoc/mat sau" rieng (luyen dich, hoi thoai) o che do on tap.
// renderItem(item, idx) phai tra ve 1 DOM node cho item do. Nhan click vao vung
// "san khau" (deck-stage) se chuyen sang item tiep theo, TRU khi click trung
// dung 1 nut/input ben trong (vd nut "Xem nghia") de khong chan tuong tac do.
function makeDeckPager(container, items, renderItem, hintText) {
  if (!items.length) { container.innerHTML = '<p class="empty-hint">(Chưa có nội dung nào cho phần này.)</p>'; return; }
  const wrap = buildDeckShell(hintText);
  container.appendChild(wrap);
  const idxSpan = wrap.querySelector('.fc-idx');
  const totalSpan = wrap.querySelector('.fc-total');
  const stage = wrap.querySelector('.deck-stage');
  const prevBtn = wrap.querySelector('.fc-prev');
  const nextBtn = wrap.querySelector('.fc-next');
  totalSpan.textContent = items.length;
  let idx = 0;

  function render() {
    idxSpan.textContent = idx + 1;
    stage.innerHTML = '';
    stage.appendChild(renderItem(items[idx], idx));
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === items.length - 1;
  }
  function goNext() { if (idx < items.length - 1) { idx++; render(); } }
  function goPrev() { if (idx > 0) { idx--; render(); } }

  prevBtn.onclick = goPrev;
  nextBtn.onclick = goNext;
  stage.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    goNext();
  });

  render();
}

RENDERERS.vocab_flashcard = function (section, container) {
  const items = section.items;
  if (!items.length) { container.innerHTML = '<p class="empty-hint">(Chưa có từ vựng nào cho flashcard.)</p>'; return; }
  let idx = 0;
  let direction = 'jp-vi';
  let flipped = false;

  const wrap = buildFlashcardShell(true, '👆 Chạm vào thẻ để lật mặt');
  container.appendChild(wrap);

  const dirBtns = [...wrap.querySelectorAll('.fc-dir-btn')];
  const idxSpan = wrap.querySelector('.fc-idx');
  const totalSpan = wrap.querySelector('.fc-total');
  const card = wrap.querySelector('.flip-card');
  const front = wrap.querySelector('.flip-card-front');
  const back = wrap.querySelector('.flip-card-back');
  const prevBtn = wrap.querySelector('.fc-prev');
  const nextBtn = wrap.querySelector('.fc-next');
  totalSpan.textContent = items.length;

  function faceHtml(item) {
    return '<div class="fc-word jp">' + item.word + '</div>' +
      (item.reading && item.reading !== item.word ? '<div class="fc-reading jp">' + item.reading + '</div>' : '');
  }

  function renderCard() {
    flipped = false;
    card.classList.remove('flipped');
    const item = items[idx];
    idxSpan.textContent = idx + 1;
    const jpHtml = faceHtml(item);
    const viHtml = '<div class="fc-meaning">' + item.meaning_vi + '</div>';
    if (direction === 'jp-vi') { front.innerHTML = jpHtml; back.innerHTML = viHtml; }
    else { front.innerHTML = viHtml; back.innerHTML = jpHtml; }
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === items.length - 1;
  }

  dirBtns.forEach(btn => {
    btn.onclick = () => {
      direction = btn.dataset.dir;
      dirBtns.forEach(b => b.classList.toggle('active', b === btn));
      renderCard();
    };
  });

  card.onclick = () => { flipped = !flipped; card.classList.toggle('flipped', flipped); };
  prevBtn.onclick = () => { if (idx > 0) { idx--; renderCard(); } };
  nextBtn.onclick = () => { if (idx < items.length - 1) { idx++; renderCard(); } };

  renderCard();
};

function renderDialogueTranslationCard(dlg, indexLabel, isReview) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = (indexLabel ? '<div class="q-num">' + indexLabel + '</div>' : '') +
    '<div class="dialogue-title">' + (dlg.title_vi || '') + '</div>';
  (dlg.turns || []).forEach(turn => {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (turn.speaker === 'A' ? 'a' : 'b');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isReview) {
      bubble.innerHTML = '<div class="vi">' + turn.vi + '</div>';
    } else {
      bubble.innerHTML = '<div class="vi">' + turn.vi + '</div>' +
        '<input type="text" placeholder="Nhập bản dịch tiếng Nhật của bạn..."/>' +
        '<div><button class="reveal-mini">Xem đáp án gợi ý</button></div>' +
        '<div class="reveal-box"></div>';
      const revealBtn = bubble.querySelector('.reveal-mini');
      const box = bubble.querySelector('.reveal-box');
      revealBtn.onclick = () => {
        box.style.display = 'block';
        box.innerHTML = '<span class="jp">Gợi ý: ' + turn.jp + '</span>';
      };
    }
    const viDiv = bubble.querySelector('.vi');
    viDiv.classList.add('show');
    row.appendChild(bubble);
    div.appendChild(row);
  });
  return div;
}

RENDERERS.dialogue_translation = function (section, container) {
  const isReview = DATA.mode === 'review';
  if (isReview) {
    makeDeckPager(container, section.items, (dlg) => renderDialogueTranslationCard(dlg, null, true),
      '👆 Chạm nền hoặc bấm "Tiếp" để sang hội thoại tiếp theo');
    return;
  }
  section.items.forEach((dlg, idx) => {
    container.appendChild(renderDialogueTranslationCard(dlg, 'Hội thoại ' + (idx + 1), false));
  });
};

function levelTag(level) {
  return level ? '<span class="level-tag">Mức ' + level + '</span>' : '';
}

// --- 1. situation_cloze: tinh huong tieng Viet + chon tu dien vao cho trong --
RENDERERS.situation_cloze = function (section, container) {
  const ctrl = makeController();
  const cards = [];
  section.items.forEach(item => {
    const n = nextNum();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="q-num">Câu ' + n + levelTag(item.level) + '</div>' +
      '<div class="situation"><b>Tình huống:</b> ' + item.situation_vi + '</div>' +
      '<div class="cloze-turns"></div>' +
      '<div class="feedback"></div><div class="explain-box"></div>';
    const turnsDiv = div.querySelector('.cloze-turns');
    const blanks = [];
    (item.turns || []).forEach(turn => {
      const row = document.createElement('div');
      row.className = 'cloze-turn';
      if (turn.speaker) {
        const sp = document.createElement('span');
        sp.className = 'cloze-speaker';
        sp.textContent = turn.speaker;
        row.appendChild(sp);
      }
      const line = document.createElement('span');
      line.className = 'cloze-line jp';
      (turn.segments || []).forEach(seg => {
        if (seg.text !== undefined) {
          const s = document.createElement('span');
          s.textContent = seg.text;
          line.appendChild(s);
        } else if (seg.blank) {
          bumpMax(1);
          const wrap = document.createElement('span');
          wrap.className = 'blank-opts';
          const rec = { blank: seg.blank, selected: null, buttons: [] };
          (seg.blank.options || []).forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'blank-opt';
            b.textContent = opt;
            b.onclick = () => {
              if (b.dataset.done) return;
              rec.selected = i;
              rec.buttons.forEach(x => x.classList.remove('selected'));
              b.classList.add('selected');
              ctrl.notify();
            };
            rec.buttons.push(b);
            wrap.appendChild(b);
          });
          line.appendChild(wrap);
          blanks.push(rec);
        }
      });
      row.appendChild(line);
      turnsDiv.appendChild(row);
    });
    cards.push({ item, blanks, fb: div.querySelector('.feedback'), exp: div.querySelector('.explain-box') });
    container.appendChild(div);
  });
  ctrl.isComplete = () => cards.every(c => c.blanks.every(b => b.selected !== null));
  ctrl.grade = () => {
    let correct = 0, total = 0;
    cards.forEach(({ blanks, fb, exp }) => {
      let cardOk = 0;
      let html = '';
      blanks.forEach(b => {
        total++;
        b.buttons.forEach(x => x.dataset.done = '1');
        const ans = b.blank.answer_index;
        if (b.selected === ans) {
          b.buttons[ans].classList.add('correct');
          cardOk++; correct++; addScore(1);
          html += '<div class="ex-line"><span class="ex-ok">Đúng (' + b.blank.options[ans] + '):</span> ' + (b.blank.explain || '') + '</div>';
        } else {
          if (b.selected !== null) b.buttons[b.selected].classList.add('wrong');
          b.buttons[ans].classList.add('correct');
          html += '<div class="ex-line"><span class="ex-no">Đáp án đúng là ' + b.blank.options[ans] + ':</span> ' + (b.blank.explain || '') + '</div>';
        }
      });
      fb.textContent = cardOk === blanks.length ? 'Chính xác.' : 'Đúng ' + cardOk + '/' + blanks.length + ' chỗ trống.';
      fb.className = 'feedback ' + (cardOk === blanks.length ? 'ok' : 'no');
      exp.innerHTML = html;
      exp.classList.add('show');
    });
    return { correct, total };
  };
  return ctrl;
};

// --- 2. error_correction: tim tu sai trong cau (hoac ket luan cau dung) ------
RENDERERS.error_correction = function (section, container) {
  const ctrl = makeController();
  const state = [];
  section.items.forEach(item => {
    bumpMax(1);
    const n = nextNum();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="q-num">Câu ' + n + levelTag(item.level) + '</div>' +
      '<div class="situation"><b>Ý muốn nói:</b> ' + item.intent_vi + '</div>' +
      '<div class="instruction-line">Bấm vào TỪ bị sai trong câu dưới đây:</div>' +
      '<div class="token-row"></div>' +
      '<div><button class="no-error-btn">Câu này đúng, không có lỗi</button></div>' +
      '<div class="feedback"></div><div class="explain-box"></div>';
    const row = div.querySelector('.token-row');
    const noErrBtn = div.querySelector('.no-error-btn');
    const rec = { item, picked: null, buttons: [], noErrBtn, fb: div.querySelector('.feedback'), exp: div.querySelector('.explain-box') };
    (item.tokens || []).forEach((tok, i) => {
      const b = document.createElement('button');
      b.className = 'token-btn jp';
      b.textContent = tok;
      b.onclick = () => {
        if (b.dataset.done) return;
        rec.picked = i;
        rec.buttons.forEach(x => x.classList.remove('picked'));
        noErrBtn.classList.remove('picked');
        b.classList.add('picked');
        ctrl.notify();
      };
      rec.buttons.push(b);
      row.appendChild(b);
    });
    noErrBtn.onclick = () => {
      if (noErrBtn.dataset.done) return;
      rec.picked = -1;
      rec.buttons.forEach(x => x.classList.remove('picked'));
      noErrBtn.classList.add('picked');
      ctrl.notify();
    };
    state.push(rec);
    container.appendChild(div);
  });
  ctrl.isComplete = () => state.every(s => s.picked !== null);
  ctrl.grade = () => {
    let correct = 0;
    state.forEach(({ item, picked, buttons, noErrBtn, fb, exp }) => {
      buttons.forEach(x => x.dataset.done = '1');
      noErrBtn.dataset.done = '1';
      const target = item.error_index;
      const ok = picked === target;
      if (picked === -1) noErrBtn.classList.add(ok ? 'correct' : 'wrong');
      else buttons[picked].classList.add(ok ? 'correct' : 'wrong');
      if (!ok) {
        if (target === -1) noErrBtn.classList.add('correct');
        else buttons[target].classList.add('correct');
      }
      if (ok) { correct++; addScore(1); fb.textContent = 'Chính xác.'; fb.className = 'feedback ok'; }
      else { fb.textContent = 'Chưa đúng.'; fb.className = 'feedback no'; }
      let html = '';
      if (item.error_type) html += '<div class="ex-line"><b>Loại lỗi:</b> ' + item.error_type + '</div>';
      if (item.correct_sentence) html += '<div class="ex-line"><b>Câu đúng:</b> <span class="jp">' + item.correct_sentence + '</span></div>';
      if (item.explain) html += '<div class="ex-line">' + item.explain + '</div>';
      exp.innerHTML = html;
      exp.classList.add('show');
    });
    return { correct, total: state.length };
  };
  return ctrl;
};

// --- 3+4. chon 1 cau dung trong nhieu cau (grammar_judgment /
//          dialogue_response) — moi lua chon co loi giai thich rieng ----------
function buildExplainedChoiceRenderer(promptHtmlFn) {
  return function (section, container) {
    const ctrl = makeController();
    const state = [];
    section.items.forEach(item => {
      bumpMax(1);
      const n = nextNum();
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = '<div class="q-num">Câu ' + n + levelTag(item.level) + '</div>' +
        promptHtmlFn(item) +
        '<div class="choice-list"></div>' +
        '<div class="feedback"></div><div class="explain-box"></div>';
      const list = div.querySelector('.choice-list');
      // Xao tron thu tu lua chon moi lan mo trang: dap an dung khong bao gio
      // co dinh o vi tri A, hoc sinh buoc phai doc het cac cau.
      const opts = shuffle(item.options || []);
      const rec = { item, opts, selected: null, buttons: [], fb: div.querySelector('.feedback'), exp: div.querySelector('.explain-box') };
      opts.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'choice-opt jp';
        b.textContent = opt.jp;
        b.onclick = () => {
          if (b.dataset.done) return;
          rec.selected = i;
          rec.buttons.forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
          ctrl.notify();
        };
        rec.buttons.push(b);
        list.appendChild(b);
      });
      state.push(rec);
      container.appendChild(div);
    });
    ctrl.isComplete = () => state.every(s => s.selected !== null);
    ctrl.grade = () => {
      let correct = 0;
      state.forEach(({ item, opts, selected, buttons, fb, exp }) => {
        buttons.forEach(x => x.dataset.done = '1');
        const answerIdx = opts.findIndex(o => o.correct);
        const ok = selected === answerIdx;
        if (selected !== null) buttons[selected].classList.add(ok ? 'correct' : 'wrong');
        if (!ok && answerIdx >= 0) buttons[answerIdx].classList.add('correct');
        if (ok) { correct++; addScore(1); fb.textContent = 'Chính xác.'; fb.className = 'feedback ok'; }
        else { fb.textContent = 'Chưa đúng, câu đúng đã tô xanh.'; fb.className = 'feedback no'; }
        let html = '';
        opts.forEach((o, i) => {
          const mark = o.correct ? '<span class="ex-ok">Đúng:</span>' : '<span class="ex-no">Sai:</span>';
          const you = i === selected ? ' <i>(bạn chọn câu này)</i>' : '';
          html += '<div class="ex-line">' + mark + ' <span class="jp">' + o.jp + '</span>' + you + '<br>' + (o.explain || '') + '</div>';
        });
        exp.innerHTML = html;
        exp.classList.add('show');
      });
      return { correct, total: state.length };
    };
    return ctrl;
  };
}

RENDERERS.grammar_judgment = buildExplainedChoiceRenderer(function (item) {
  return '<div class="situation"><b>Câu tiếng Việt:</b> ' + item.meaning_vi + '</div>' +
    '<div class="instruction-line">Câu tiếng Nhật nào diễn đạt ĐÚNG ý trên?</div>';
});

RENDERERS.dialogue_response = buildExplainedChoiceRenderer(function (item) {
  return '<div class="situation"><b>Tình huống:</b> ' + item.situation_vi + '</div>' +
    (item.question_jp ? '<div class="given-jp jp">' + item.question_jp + '</div>' : '') +
    '<div class="instruction-line">Chọn cách nói phù hợp nhất:</div>';
});

// --- 5. sentence_transform: bien doi cau (hoc sinh tu viet, tu doi chieu) ----
RENDERERS.sentence_transform = function (section, container) {
  section.items.forEach(item => {
    const n = nextNum();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="q-num">Câu ' + n + levelTag(item.level) + '</div>' +
      '<div class="instruction-line">Yêu cầu: ' + item.instruction_vi + '</div>' +
      '<div class="given-jp jp">' + item.given_jp + '</div>' +
      '<input type="text" placeholder="Viết câu đã biến đổi..."/>' +
      '<div><button class="reveal-btn">Xem đáp án</button></div>' +
      '<div class="explain-box"></div>';
    const btn = div.querySelector('.reveal-btn');
    const exp = div.querySelector('.explain-box');
    btn.onclick = () => {
      let html = '<div class="ex-line"><b>Đáp án:</b> <span class="jp">' + item.answer_jp + '</span></div>';
      if (item.explain) html += '<div class="ex-line">' + item.explain + '</div>';
      exp.innerHTML = html;
      exp.classList.add('show');
    };
    if (item.hint) {
      const hint = document.createElement('div');
      hint.className = 'fc-hint';
      hint.textContent = 'Gợi ý: ' + item.hint;
      div.insertBefore(hint, div.querySelector('input'));
    }
    container.appendChild(div);
  });
};

const app = document.getElementById('app');
const tabBar = document.getElementById('tab-bar');
const panels = [];

if (DATA.sections && DATA.sections.length > 0) {
  DATA.sections.forEach((section, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    tabBtn.title = section.title;
    tabBtn.innerHTML = '<span>' + (section.icon || '') + '</span><span>Phần ' + (idx + 1) + '</span>';
    tabBtn.onclick = () => selectTab(idx);
    tabBar.appendChild(tabBtn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (idx === 0 ? ' active' : '');
    const heading = document.createElement('div');
    heading.className = 'panel-title';
    heading.innerHTML = (section.icon || '') + ' ' + section.title;
    panel.appendChild(heading);

    const body = document.createElement('div');
    body.className = 'panel-body';
    const qCol = document.createElement('div');
    qCol.className = 'panel-questions';
    body.appendChild(qCol);

    qCounter = 0;
    const renderer = RENDERERS[section.type];
    let ctrl = null;
    if (renderer) ctrl = renderer(section, qCol) || null;
    else qCol.innerHTML = '<p class="empty-hint">(Chưa hỗ trợ dạng bài: ' + section.type + ')</p>';

    panel.appendChild(body);

    if (ctrl && !NO_SUBMIT_TYPES.has(section.type)) {
      const side = document.createElement('div');
      side.className = 'panel-side';
      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = 'Trả lời';
      submitBtn.disabled = !ctrl.isComplete();
      const sectionFb = document.createElement('div');
      sectionFb.className = 'section-feedback';
      side.appendChild(submitBtn);
      side.appendChild(sectionFb);
      body.appendChild(side);

      ctrl.onChange(() => { submitBtn.disabled = submitBtn.dataset.done ? true : !ctrl.isComplete(); });
      submitBtn.onclick = () => {
        if (submitBtn.dataset.done) return;
        submitBtn.dataset.done = '1';
        submitBtn.disabled = true;
        const result = ctrl.grade();
        if (result && typeof result.correct === 'number') {
          sectionFb.textContent = 'Đúng ' + result.correct + '/' + result.total + '.';
          sectionFb.className = 'section-feedback ' + (result.correct === result.total ? 'ok' : 'no');
          if (result.correct === result.total) burstConfetti({ particleCount: 90, spread: 100 });
        }
      };
    }

    app.appendChild(panel);
    panels.push(panel);
  });
} else {
  app.innerHTML = '<p class="empty-hint">Chưa có bài tập nào được bật cho phần này.</p>';
}

const tabBtns = [...tabBar.children];
function selectTab(idx) {
  tabBtns.forEach((b, i) => b.classList.toggle('active', i === idx));
  panels.forEach((p, i) => p.classList.toggle('active', i === idx));
  app.scrollTop = 0;
}
